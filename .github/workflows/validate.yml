name: Validate profile

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Test without network credentials
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js for Pac-Man
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install pinned Pac-Man renderer
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Pac-Man uses the saved snapshot
        run: npm run generate:pacman -- --check

      - name: Validate profile assets and links
        run: python scripts/validate_profile.py

      - name: Check generated files match the saved snapshot
        run: python scripts/generate_profile.py --check
