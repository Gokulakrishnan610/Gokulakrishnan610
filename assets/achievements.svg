<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Achievement cabinet</title>
<desc id="desc">Four verified competition milestones: Smart India Hackathon 2024, Winner; IIT Kanpur Hackathon, Top 6; PALS Aquatic Drone Challenge 2025, Finalist; RAP Hackathon 2025, Runner-Up</desc>
<defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11172a"/><stop offset=".55" stop-color="#070914"/><stop offset="1" stop-color="#141027"/></linearGradient>
<linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#49e39b"/><stop offset=".2" stop-color="#ffd84d"/><stop offset=".42" stop-color="#ff7a45"/><stop offset=".62" stop-color="#ff5ca8"/><stop offset=".82" stop-color="#a56eff"/><stop offset="1" stop-color="#45d9ff"/></linearGradient>
<filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<style>@keyframes enter{0%{opacity:0;transform:translateY(12px)}18%,100%{opacity:1;transform:translateY(0)}}@keyframes scan{0%,10%{transform:translateX(0)}90%,100%{transform:translateX(190px)}}@keyframes orbit{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.32}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes hue{to{filter:hue-rotate(360deg)}}@keyframes sparkle{0%,100%{opacity:.2;transform:scale(.65)}50%{opacity:1;transform:scale(1.2)}}@keyframes cityCycle{0%,38%,100%{opacity:1}48%,82%{opacity:.08}}@keyframes logoCycle{0%,38%,100%{opacity:.05}48%,82%{opacity:1}}@keyframes build{0%,100%{transform:translateY(0)}45%{transform:translateY(-12px)}}@keyframes blockHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}.enter{opacity:1;animation:enter 5s ease-out infinite}.scan{animation:scan 6s cubic-bezier(.65,0,.35,1) infinite alternate}.orbit{animation:orbit 8s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.city{animation:hue 18s linear infinite}.spark{transform-box:fill-box;transform-origin:center;animation:sparkle 2.8s ease-in-out infinite}.city-mode{animation:cityCycle 16s ease-in-out infinite}.logo-mode{opacity:.05;animation:logoCycle 16s ease-in-out infinite}.tower{animation:build 8s ease-in-out infinite}.logo-cube{animation:blockHop 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.enter,.scan,.orbit,.pulse,.float,.city,.spark,.city-mode,.tower,.logo-cube{animation:none!important;opacity:1!important}.logo-mode{animation:none!important;opacity:.05!important}}</style>
